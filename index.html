<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Sorteo Pasanaco</title>

<style>

body{
font-family:Arial;
text-align:center;
padding-top:100px;
background:#f4f4f4;
}

#ganador{
font-size:50px;
font-weight:bold;
color:#0077cc;
}

</style>

</head>

<body>

<h1>Sorteo Pasanaco</h1>

<div id="ganador">
Esperando sorteo...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDDA56p44wW_kWFP9qC1iF-qLHImhJ68hw",
authDomain: "pasanaco-b416e.firebaseapp.com",
projectId: "pasanaco-b416e",
storageBucket: "pasanaco-b416e.firebasestorage.app",
messagingSenderId: "934737854131",
appId: "1:934737854131:web:5691feff6bcdf3313f3ac6"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

onSnapshot(
doc(db,"Sorteo","Resultado"),
(docSnap)=>{

const datos = docSnap.data();

document.getElementById("ganador")
.innerText = datos.Ganador;

}
);

</script>

</body>

</html>
