<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sorteo Pasanaco</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f0f0f0;
padding:30px;
}

#nombre{
font-size:50px;
font-weight:bold;
margin:30px;
color:#0066cc;
}

button{
font-size:22px;
padding:15px 30px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>PASANACO</h1>

<div id="nombre">
Presiona Sortear
</div>

<button onclick="sortear()">
🎲 SORTEAR
</button>

<script>

const participantes = [
"Juan",
"Pedro",
"Carlos",
"María",
"José",
"Luis",
"Maria",
"Jesus",
"Diez",
"Gutierrez",
];

function sortear(){

let vueltas = 0;

let intervalo = setInterval(()=>{

let aleatorio =
participantes[Math.floor(Math.random()*participantes.length)];

document.getElementById("nombre").innerText = aleatorio;

vueltas++;

if(vueltas > 40){

clearInterval(intervalo);

let ganador =
participantes[Math.floor(Math.random()*participantes.length)];

document.getElementById("nombre").innerText =
"🏆 " + ganador;

}

},100);

}

</script>

</body>
</html>
